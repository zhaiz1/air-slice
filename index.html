<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Slice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Lilita+One&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen canvas + top HUD + centered menu card. Single dark arcade look */
:root{
  --bg:#0e1016; --ink:#f6f1e7; --muted:#a3abb9; --accent:#ffcf3f; --danger:#ff5252;
  --panel:rgba(14,16,22,.82);
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --body:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
:root[lang="en"]{--display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
video{display:none}
[hidden]{display:none!important}
.hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-family:var(--display)}
.score{font-size:52px;color:var(--accent);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.best{font-family:var(--body);font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.lives{font-size:36px;letter-spacing:6px;font-family:var(--body);font-weight:600}
.lives span{color:rgba(255,255,255,.2)}
.lives span.lost{color:var(--danger)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(14,16,22,.45)}
.card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px 28px;max-width:420px;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:60px;margin:0 0 10px;color:var(--accent);letter-spacing:.04em}
p{color:var(--muted);line-height:1.65;margin:0 0 22px;font-size:15px}
.btns{display:flex;flex-direction:column;gap:10px}
button{font:600 16px var(--body);padding:14px 18px;border-radius:12px;border:0;cursor:pointer}
.primary{background:var(--accent);color:#1d1603}
.primary:hover{filter:brightness(1.06)}
.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.22)}
.ghost:hover{background:rgba(255,255,255,.06)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.status{margin:16px 0 0;color:var(--ink)}
.status.err{color:var(--danger)}
.privacy{font-size:12px;margin:18px 0 0}
.lang-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font-size:14px;padding:9px 14px;border-radius:999px;background:var(--panel);color:var(--ink);border:1px solid rgba(255,255,255,.2);z-index:5}
.lang-btn:hover{background:rgba(40,44,56,.9)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel);padding:10px 18px;border-radius:999px;font-size:14px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="cam" playsinline muted></video>

<div class="hud" id="hud" hidden>
  <div>
    <div class="score" id="score">0</div>
    <div class="best" id="best">Best 0</div>
  </div>
  <div class="lives" id="lives"><span>✕</span><span>✕</span><span>✕</span></div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1 data-i18n="title">Air Slice</h1>
    <p data-i18n="intro">Swing your index finger in front of the camera like a blade. Slice the flying fruit and dodge the bombs. Miss 3 fruits and the game is over.</p>
    <div class="btns" id="btns">
      <button class="primary" id="btnCam" data-i18n="btnCam">Turn on camera and play</button>
      <button class="ghost" id="btnMouse" data-i18n="btnMouse">No camera? Play with mouse or touch</button>
    </div>
    <p class="status" id="status" hidden></p>
    <p class="privacy" data-i18n="privacy">Video is processed only in your browser and never uploaded.</p>
  </div>
</div>

<button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">English</button>
<div class="toast" id="toast" hidden></div>

<script type="module">
// ================= Config =================
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
const BLADE_COLORS = ['#7fd8ff', '#ff9ad5'];

const TYPES = {
  watermelon:{r:54,skin:'#2e8b3e',stripe:'#1a5a28',flesh:'#ff4560',rind:'#d4f5b0',seed:'#2a1616',juice:'#ff3d5a'},
  orange:    {r:37,skin:'#ff9419',flesh:'#ffb347',rind:'#fff0d6',juice:'#ffa62b',segments:true},
  apple:     {r:35,skin:'#d92b3a',flesh:'#fff3cf',rind:'#fff9e8',seed:'#5a3410',juice:'#fff0b8',stem:true},
  lemon:     {r:32,skin:'#ffd93b',flesh:'#fff27a',rind:'#fffbe0',juice:'#fff176',segments:true,oval:true},
  kiwi:      {r:31,skin:'#8a6a3c',flesh:'#7cc242',rind:'#b9e08a',seed:'#1a1a1a',juice:'#a6e05a',core:'#f3f7d8'},
  plum:      {r:30,skin:'#6c2f8f',flesh:'#ffbf5e',rind:'#ffe2a8',juice:'#ffb347',pit:'#8a4a1a'},
};
const FRUIT_KEYS = Object.keys(TYPES);

// ================= i18n (UI strings in both languages) =================
const I18N = {
  zh:{ docTitle:'隔空切果', title:'隔空切果', other:'English',
    intro:'对着摄像头挥动食指当刀，切开飞起的水果，避开炸弹。漏掉 3 个水果，游戏结束。握拳保持半秒可以暂停。',
    paused:'已暂停', resumeCam:'再次握拳半秒继续', resumeKey:'按 P 或空格继续',
    btnCam:'开启摄像头开始', btnMouse:'没有摄像头？用鼠标或触屏玩', privacy:'摄像头画面只在你的浏览器里处理，不会上传。',
    d_easy:'简单', d_normal:'普通', d_hard:'困难',
    h_easy:'大水果 · 慢节奏', h_normal:'标准体验', h_hard:'小水果 · 又快又密',
    best:'最高', score:'得分', boom:'炸弹！', combo:n => `${n} 连切 +${n}`,
    loading:'正在打开摄像头并加载手势模型…',
    denied:'摄像头权限被拒绝。请在地址栏允许摄像头后重试，或改用鼠标玩。',
    nocam:'这个浏览器不支持摄像头。可以改用鼠标玩。',
    loadFail:'手势模型加载失败，请检查网络后重试，或改用鼠标玩。',
    pickCam:'伸出食指，切开一个西瓜选择难度', pickMouse:'按住并快速划过一个西瓜选择难度',
    over:'游戏结束', noHand:'没看到你的手，把手举到镜头前，离摄像头远一点' },
  en:{ docTitle:'Air Slice', title:'Air Slice', other:'中文',
    intro:'Swing your index finger in front of the camera like a blade. Slice the flying fruit and dodge the bombs. Miss 3 fruits and the game is over. Hold a fist for half a second to pause.',
    paused:'Paused', resumeCam:'Hold a fist again to resume', resumeKey:'Press P or Space to resume',
    btnCam:'Turn on camera and play', btnMouse:'No camera? Play with mouse or touch', privacy:'Video is processed only in your browser and never uploaded.',
    d_easy:'Easy', d_normal:'Normal', d_hard:'Hard',
    h_easy:'Big fruit · slow pace', h_normal:'The standard game', h_hard:'Small fruit · fast and frequent',
    best:'Best', score:'Score', boom:'BOOM!', combo:n => `${n}x Combo +${n}`,
    loading:'Opening camera and loading the hand model…',
    denied:'Camera access was blocked. Allow the camera in the address bar and try again, or play with the mouse.',
    nocam:'This browser does not support the camera. You can play with the mouse instead.',
    loadFail:'The hand model failed to load. Check your connection and try again, or play with the mouse.',
    pickCam:'Point your index finger and slice a melon to pick a difficulty', pickMouse:'Hold and swipe through a melon to pick a difficulty',
    over:'Game Over', noHand:"Can't see your hand. Raise it in front of the camera and step back a little." },
};
let lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
try { const l = localStorage.getItem('gesture-fruit-lang'); if (I18N[l]) lang = l; } catch(e){}
const tr = k => I18N[lang][k];
let statusKey = null;
function applyLang(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  if (lang === 'en') document.documentElement.setAttribute('lang','en');
  document.title = tr('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.getElementById('langBtn').textContent = tr('other');
  if (statusKey) document.getElementById('status').textContent = tr(statusKey);
  if (typeof hud === 'function' && !document.getElementById('hud').hidden) hud();
}
function toggleLang(){
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('gesture-fruit-lang', lang); } catch(e){}
  applyLang();
}
const DISPLAY_FONT = () => lang === 'zh' ? '"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif' : '"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif';

// Difficulty: size = fruit size multiplier, rate = spawn interval multiplier (lower = denser), speed = flight speed multiplier, bomb = bomb chance multiplier
const DIFFS = {
  easy:   { size:1.45, rate:1.35, speed:0.8,  bomb:0.6, wave:0.7 },
  normal: { size:1.2,  rate:1.0,  speed:1.0,  bomb:1.0, wave:1.0 },
  hard:   { size:0.9,  rate:0.65, speed:1.3,  bomb:1.4, wave:1.35 },
};
const DIFF_KEYS = ['easy','normal','hard'];
let diff = 'normal';
try { const d = localStorage.getItem('gesture-fruit-diff'); if (DIFFS[d]) diff = d; } catch(e){}
const D = () => DIFFS[diff];

// ================= Canvas =================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const video = document.getElementById('cam');
let W = 0, H = 0, DPR = 1, U = 1;
let starters = [];
function placeStarters(){
  starters.forEach((s,i) => {
    s.x = W*(0.2 + i*0.3); s.y = H*0.58;
    s.r = Math.min(W*0.11, TYPES.watermelon.r*U*1.25*DIFFS[s.diff].size);
  });
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U = Math.min(W, H) / 800;
  placeStarters();
}
addEventListener('resize', resize);
resize();
const G = () => H * 1.25;
const SPEED_MIN = () => 650 * U;

// ================= Smoothing filter (One Euro) =================
class LowPass{ constructor(){ this.y = null; } f(x,a){ this.y = this.y===null ? x : a*x + (1-a)*this.y; return this.y; } }
class OneEuro{
  constructor(minCutoff=1.4, beta=0.012, dCutoff=1){ this.mc=minCutoff; this.beta=beta; this.dc=dCutoff; this.reset(); }
  reset(){ this.x=new LowPass(); this.dx=new LowPass(); this.t=null; this.prev=null; }
  alpha(c,dt){ const tau = 1/(2*Math.PI*c); return 1/(1+tau/dt); }
  filter(x,t){
    if (this.t===null){ this.t=t; this.prev=x; this.x.y=x; this.dx.y=0; return x; }
    const dt = Math.max(1e-3, t-this.t); this.t = t;
    const edx = this.dx.f((x-this.prev)/dt, this.alpha(this.dc,dt));
    const r = this.x.f(x, this.alpha(this.mc + this.beta*Math.abs(edx), dt));
    this.prev = r; return r;
  }
}

// ================= Blade trail =================
class Blade{
  constructor(){ this.pts=[]; this.fx=new OneEuro(); this.fy=new OneEuro(); this.speed=0; this.head=null; }
  add(x,y,t){
    const prev = this.pts[this.pts.length-1];
    this.head = {x,y,t};
    if (prev && t - prev.t > 200){ this.pts = []; this.pts.push({x,y,t}); this.speed = 0; return; }
    this.pts.push({x,y,t});
    if (!prev) return;
    const d = Math.hypot(x-prev.x, y-prev.y);
    const v = d / (Math.max(8, t-prev.t)/1000);
    this.speed = this.speed*0.35 + v*0.65;
    trySlice(prev.x, prev.y, x, y, this.speed, t);
  }
  lost(){ this.fx.reset(); this.fy.reset(); }
  prune(now){ while (this.pts.length && now - this.pts[0].t > 150) this.pts.shift(); }
}
const blades = [new Blade(), new Blade()];

// ================= Game state =================
let mode = null;          // 'camera' | 'mouse'
let state = 'menu';       // 'menu' | 'ready' | 'playing' | 'over'
let fruits = [], halves = [], particles = [], splats = [], popups = [];
let score = 0, lives = 3, best = 0, elapsed = 0, spawnT = 0, queue = [];
let comboCount = 0, comboT = 0, comboX = 0, comboY = 0;
let flash = 0, shake = 0, pendingStart = -1, overDelay = -1, lastHandSeen = 0;
let handsLm = [];
let paused = false, fistStart = 0, fistArmed = true, fistProgress = 0, fistHands = [];
const FIST_HOLD = 500;
function loadBest(){ try { best = +localStorage.getItem('gesture-fruit-best-' + diff) || 0; } catch(e){ best = 0; } }
loadBest();

const $ = id => document.getElementById(id);
function hud(){
  $('score').textContent = score;
  $('best').textContent = `${tr('d_'+diff)} · ${tr('best')} ${best}`;
  [...$('lives').children].forEach((s,i) => s.classList.toggle('lost', i < 3 - lives));
}

function makeStarter(){
  starters = DIFF_KEYS.map((k,i) => ({ static:true, starter:true, diff:k, type:'watermelon', x:0, y:0, r:0,
              vx:0, vy:0, rot:i, vr:0.6, bob:i*1.3, dead:false }));
  placeStarters();
  fruits.push(...starters);
}
function toReady(){ state='ready'; fruits=[]; makeStarter(); }
function startGame(){
  paused=false; fistArmed=false;
  state='playing'; score=0; lives=3; elapsed=0; spawnT=0.6; queue=[];
  fruits = fruits.filter(f => !f.starter); starters = [];
  loadBest();
  $('hud').hidden = false; hud();
}
function gameOver(){
  if (state !== 'playing') return;
  paused = false;
  state = 'over';
  if (score > best){ best = score; try{ localStorage.setItem('gesture-fruit-best-' + diff, best); }catch(e){} }
  hud(); overDelay = 1.0; queue = [];
}

// ================= Spawning =================
function spawn(bomb){
  const key = FRUIT_KEYS[(Math.random()*FRUIT_KEYS.length)|0];
  const d = D();
  const r = (bomb ? 36 : TYPES[key].r) * U * d.size;
  const x = W*(0.12 + Math.random()*0.76);
  const h = H*(0.55 + Math.random()*0.32);
  const g = G() * d.speed * d.speed;   // speed squared: same apex height, flight time scales by 1/speed
  const vy = -Math.sqrt(2*g*h);
  const tApex = -vy / g;
  const tx = W*(0.25 + Math.random()*0.5);
  fruits.push({ bomb, type:key, x, y:H + r, r, g, vx:(tx-x)/(tApex*1.7), vy,
                rot:Math.random()*6, vr:(Math.random()-0.5)*5*d.speed, dead:false });
}
function updateSpawner(dt){
  const d = D();
  elapsed += dt; spawnT -= dt;
  if (spawnT <= 0){
    const lvl = Math.min(1, elapsed/90);
    const n = 1 + Math.floor(Math.random()*(1.5 + lvl*3.5)*d.wave);
    for (let i=0;i<n;i++){
      const bomb = elapsed > 8 && Math.random() < (0.07 + lvl*0.13)*d.bomb;
      queue.push({ at: elapsed + i*(0.12 + Math.random()*0.15)*d.rate, bomb });
    }
    spawnT = (1.7 - lvl*0.85 + Math.random()*0.4) * d.rate;
  }
  queue = queue.filter(q => { if (q.at <= elapsed){ spawn(q.bomb); return false; } return true; });
}

// ================= Slicing =================
function segHit(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy || 1;
  let t=((cx-x1)*dx+(cy-y1)*dy)/l2; t=Math.max(0,Math.min(1,t));
  const px=x1+t*dx, py=y1+t*dy;
  return (px-cx)**2 + (py-cy)**2 <= r*r;
}
function trySlice(x1,y1,x2,y2,speed,now){
  if (paused || speed < SPEED_MIN()) return;
  const ang = Math.atan2(y2-y1, x2-x1);
  for (const f of fruits){
    if (f.dead) continue;
    if (state !== 'playing' && !f.starter) continue;
    if (!segHit(x1,y1,x2,y2,f.x,f.y,f.r*1.08)) continue;
    if (f.bomb) explode(f); else sliceFruit(f, ang, now);
  }
}
function sliceFruit(f, ang, now){
  f.dead = true;
  const t = TYPES[f.type];
  const push = 140*U;
  for (const side of [0,1]){
    const s = side ? -1 : 1;
    const nx = Math.sin(ang)*s, ny = -Math.cos(ang)*s;
    halves.push({ type:f.type, r:f.r, x:f.x, y:f.y, ang, side,
      vx:f.vx + nx*push, vy:Math.min(f.vy, 0) + ny*push - 60*U, rot:0, vr:(side?1:-1)*(1.5+Math.random()*2) });
  }
  for (let i=0;i<18;i++){
    const a = Math.random()*Math.PI*2, v = (120 + Math.random()*420)*U;
    particles.push({ x:f.x, y:f.y, vx:Math.cos(a)*v + f.vx*0.4, vy:Math.sin(a)*v + f.vy*0.2,
      size:(2.5+Math.random()*5)*U, life:0.5+Math.random()*0.5, max:1, color:t.juice, grav:1 });
  }
  const blobs = Array.from({length:7}, () => ({ dx:(Math.random()-0.5)*f.r*1.6, dy:(Math.random()-0.5)*f.r*1.6, r:f.r*(0.25+Math.random()*0.45) }));
  splats.push({ x:f.x, y:f.y, color:t.juice, a:0.5, blobs });
  if (splats.length > 25) splats.shift();
  sfx.slice();
  if (f.starter){
    if (pendingStart >= 0) return;
    diff = f.diff;
    try { localStorage.setItem('gesture-fruit-diff', diff); } catch(e){}
    popups.push({ x:f.x, y:f.y - f.r, text:tr('d_'+diff), color:'#ffcf3f', size:40, life:0.9 });
    for (const o of fruits) if (o.starter && !o.dead){ o.static = false; o.vy = -80*U; o.g = G(); }
    pendingStart = 0.6; return;
  }
  score += 1;
  popups.push({ x:f.x, y:f.y - f.r, text:'+1', color:'#ffffff', size:28, life:0.7 });
  if (now - comboT < 280) comboCount++; else comboCount = 1;
  comboT = now; comboX = f.x; comboY = f.y;
  hud();
}
function explode(f){
  f.dead = true;
  flash = 1; shake = 22*U;
  for (let i=0;i<60;i++){
    const a = Math.random()*Math.PI*2, v = (100 + Math.random()*700)*U;
    const c = ['#ffcf3f','#ff7a2e','#ff4d4d','#7a7f8f'][(Math.random()*4)|0];
    particles.push({ x:f.x, y:f.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, size:(3+Math.random()*7)*U,
      life:0.6+Math.random()*0.7, max:1, color:c, grav:0.3 });
  }
  popups.push({ x:f.x, y:f.y, text:tr('boom'), color:'#ff5252', size:46, life:1.2 });
  sfx.boom();
  gameOver();
}
function miss(f){
  lives--;
  popups.push({ x:Math.max(40*U, Math.min(W-40*U, f.x)), y:H - 50*U, text:'✕', color:'#ff5252', size:44, life:0.9 });
  sfx.miss(); hud();
  if (lives <= 0) gameOver();
}

// ================= Hand tracking =================
let landmarker = null, lastVideoTime = -1;
function videoRect(){
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W/vw, H/vh), dw = vw*s, dh = vh*s;
  return { x:(W-dw)/2, y:(H-dh)/2, w:dw, h:dh };
}
function mapPt(nx, ny, vr){ return [vr.x + (1-nx)*vr.w, vr.y + ny*vr.h]; }
function detect(now){
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let res;
  try { res = landmarker.detectForVideo(video, now); } catch(e){ return; }
  const hands = res.landmarks || [];
  const vr = videoRect();
  handsLm = hands.map(lm => lm.map(p => mapPt(p.x, p.y, vr)));
  if (hands.length) lastHandSeen = now;
  const tips = handsLm.map(h => h[8]);
  // Keep each hand mapped to the same blade across frames
  const dist = (p,b) => b.head && now - b.head.t < 400 ? Math.hypot(p[0]-b.head.x, p[1]-b.head.y) : 1e4;
  let order = [0,1];
  if (tips.length === 2){
    if (dist(tips[0],blades[1]) + dist(tips[1],blades[0]) < dist(tips[0],blades[0]) + dist(tips[1],blades[1])) order = [1,0];
  } else if (tips.length === 1){
    if (dist(tips[0],blades[1]) < dist(tips[0],blades[0])) order = [1,0];
  }
  const used = new Set();
  fistHands = handsLm.map(isFist);
  tips.forEach((p,i) => {
    if (fistHands[i]) return;          // A closed fist is not a blade, so the pause gesture never slices
    const b = blades[order[i]]; used.add(order[i]);
    const t = now/1000;
    b.add(b.fx.filter(p[0],t), b.fy.filter(p[1],t), now);
  });
  blades.forEach((b,i) => { if (!used.has(i)){ b.lost(); b.pts = []; } });
  updateFist(now);
}

// ================= Fist to pause =================
// Fist = all four fingertips are closer to the wrist than their PIP joints
function isFist(h){
  const d = (a,b) => Math.hypot(h[a][0]-h[b][0], h[a][1]-h[b][1]);
  return [[8,6],[12,10],[16,14],[20,18]].every(([tip,pip]) => d(tip,0) < d(pip,0));
}
function updateFist(now){
  const any = fistHands.some(Boolean);
  if (state !== 'playing' || !any){ fistArmed = true; fistStart = 0; fistProgress = 0; return; }
  if (!fistArmed) { fistProgress = 0; return; }   // Hand must open before the gesture can fire again
  if (!fistStart) fistStart = now;
  fistProgress = Math.min(1, (now - fistStart) / FIST_HOLD);
  if (fistProgress >= 1){ togglePause(); fistArmed = false; fistStart = 0; fistProgress = 0; }
}
function togglePause(){
  if (state !== 'playing') return;
  paused = !paused;
  if (!paused) lastHandSeen = performance.now();   // After resuming, allow 2.5 s to bring the hand back into view
  blades.forEach(b => { b.pts = []; b.speed = 0; });
  tone(paused ? 520 : 390, paused ? 390 : 520, 0.15, 0.2);
  last = performance.now();
}

async function startCamera(){
  initAudio();
  const status = $('status');
  $('btnCam').disabled = true; $('btnMouse').disabled = true;
  status.hidden = false; status.className = 'status'; statusKey = 'loading'; status.textContent = tr(statusKey);
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('nocam');
    const camP = navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:1280}, height:{ideal:720}, facingMode:'user' }, audio:false });
    const visionP = import(CDN);
    const stream = await camP;
    video.srcObject = stream; await video.play();
    const vision = await visionP;
    const fileset = await vision.FilesetResolver.forVisionTasks(CDN + '/wasm');
    const opts = d => ({ baseOptions:{ modelAssetPath:MODEL, delegate:d }, runningMode:'VIDEO', numHands:2,
                         minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5 });
    try { landmarker = await vision.HandLandmarker.createFromOptions(fileset, opts('GPU')); }
    catch(e){ landmarker = await vision.HandLandmarker.createFromOptions(fileset, opts('CPU')); }
    mode = 'camera'; lastHandSeen = performance.now();
    $('menu').hidden = true; toReady();
  } catch(e){
    console.error(e);
    status.className = 'status err';
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    statusKey = denied ? 'denied' : e && e.message === 'nocam' ? 'nocam' : 'loadFail';
    status.textContent = tr(statusKey);
    $('btnCam').disabled = false; $('btnMouse').disabled = false;
  }
}
function startMouse(){ initAudio(); mode='mouse'; $('menu').hidden = true; toReady(); }
$('btnCam').addEventListener('click', startCamera);
$('btnMouse').addEventListener('click', startMouse);
$('langBtn').addEventListener('click', toggleLang);
addEventListener('keydown', e => {
  if (e.key === 'l' || e.key === 'L') toggleLang();
  if ((e.key === 'p' || e.key === 'P' || e.key === ' ') && state === 'playing'){ e.preventDefault(); togglePause(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing' && !paused) togglePause(); });
applyLang();
cv.addEventListener('pointermove', e => {
  if (mode !== 'mouse') return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) blades[0].add(ev.clientX, ev.clientY, performance.now());
});

// ================= Sound =================
let ac = null, noiseBuf = null;
function initAudio(){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    if (!noiseBuf){
      noiseBuf = ac.createBuffer(1, ac.sampleRate*0.7, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
  } catch(e){}
}
function noise(dur,f1,f2,q,vol,type='bandpass'){
  if (!ac || !noiseBuf) return;
  const t = ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f1,t); fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(fl).connect(g).connect(ac.destination); s.start(t); s.stop(t+dur+0.05);
}
function tone(f1,f2,dur,vol){
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
}
const sfx = {
  slice(){ noise(0.15,3200,700,1.1,0.45); noise(0.1,600,180,0.7,0.3,'lowpass'); },
  boom(){ noise(0.65,900,50,0.6,1,'lowpass'); tone(120,40,0.5,0.4); },
  miss(){ tone(320,110,0.3,0.25); },
  combo(){ tone(660,990,0.18,0.18); },
};

// ================= Drawing =================
function circle(r, color){ ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=color; ctx.fill(); }
function drawWhole(t, r){
  ctx.save();
  if (t.oval) ctx.scale(1.15, 0.9);
  circle(r, t.skin);
  if (t.stripe){
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
    ctx.strokeStyle = t.stripe; ctx.lineWidth = r*0.16;
    for (let k=-2;k<=2;k++){ const x=k*r*0.42; ctx.beginPath(); ctx.moveTo(x,-r); ctx.bezierCurveTo(x+r*0.2,-r*0.4,x-r*0.2,r*0.4,x,r); ctx.stroke(); }
    ctx.restore();
  }
  const g = ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.05,0,0,r);
  g.addColorStop(0,'rgba(255,255,255,.5)'); g.addColorStop(0.35,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,.35)');
  circle(r, g);
  ctx.restore();
  if (t.stem){
    ctx.strokeStyle='#5a3410'; ctx.lineWidth=r*0.1; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-r*0.85); ctx.quadraticCurveTo(r*0.05,-r*1.15,r*0.12,-r*1.28); ctx.stroke();
    ctx.fillStyle='#4caf50'; ctx.beginPath(); ctx.ellipse(r*0.34,-r*1.1,r*0.28,r*0.12,-0.5,0,Math.PI*2); ctx.fill();
  }
}
function drawFace(t, r){
  ctx.save();
  if (t.oval) ctx.scale(1.15, 0.9);
  circle(r, t.skin); circle(r*0.9, t.rind); circle(r*0.8, t.flesh);
  if (t.segments){
    ctx.strokeStyle = t.rind; ctx.lineWidth = r*0.05;
    for (let i=0;i<10;i++){ const a=i/10*Math.PI*2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.78, Math.sin(a)*r*0.78); ctx.stroke(); }
  }
  if (t.core) circle(r*0.25, t.core);
  if (t.seed){
    ctx.fillStyle = t.seed;
    const n = t.core ? 14 : 8, rr = t.core ? r*0.4 : r*0.5;
    for (let i=0;i<n;i++){ const a=i/n*Math.PI*2; ctx.beginPath(); ctx.ellipse(Math.cos(a)*rr, Math.sin(a)*rr, r*0.065, r*0.035, a, 0, Math.PI*2); ctx.fill(); }
  }
  if (t.pit){ ctx.fillStyle=t.pit; ctx.beginPath(); ctx.ellipse(0,0,r*0.28,r*0.38,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawBomb(r, time){
  const pulse = 0.5 + 0.5*Math.sin(time*0.012);
  ctx.save();
  ctx.shadowColor = `rgba(255,70,70,${0.45+0.45*pulse})`; ctx.shadowBlur = 24*U;
  circle(r, '#1c1e26'); ctx.shadowBlur = 0;
  ctx.strokeStyle='#3b3f4d'; ctx.lineWidth=r*0.08; ctx.beginPath(); ctx.arc(0,0,r*0.82,0,Math.PI*2); ctx.stroke();
  const g = ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.05,0,0,r);
  g.addColorStop(0,'rgba(255,255,255,.35)'); g.addColorStop(0.4,'rgba(255,255,255,0)'); circle(r, g);
  ctx.fillStyle='#5a5f70'; ctx.fillRect(-r*0.22,-r*1.12,r*0.44,r*0.26);
  ctx.strokeStyle='#c8a26a'; ctx.lineWidth=r*0.09; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-r*1.1); ctx.quadraticCurveTo(r*0.3,-r*1.45,r*0.5,-r*1.38); ctx.stroke();
  ctx.strokeStyle = Math.random() < 0.5 ? '#ffe066' : '#ff8a2e'; ctx.lineWidth = 2*U;
  for (let i=0;i<6;i++){ const a=Math.random()*Math.PI*2, l=(6+Math.random()*10)*U; ctx.beginPath(); ctx.moveTo(r*0.5,-r*1.38); ctx.lineTo(r*0.5+Math.cos(a)*l, -r*1.38+Math.sin(a)*l); ctx.stroke(); }
  ctx.strokeStyle='#ff5252'; ctx.lineWidth=r*0.14;
  const k=r*0.32; ctx.beginPath(); ctx.moveTo(-k,-k); ctx.lineTo(k,k); ctx.moveTo(k,-k); ctx.lineTo(-k,k); ctx.stroke();
  ctx.restore();
}
function drawBlade(b, now, color){
  b.prune(now);
  const p = b.pts;
  if (p.length > 1){
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    for (let pass=0; pass<2; pass++){
      for (let i=1;i<p.length;i++){
        const k = i/(p.length-1);
        ctx.strokeStyle = pass ? '#ffffff' : color;
        ctx.globalAlpha = pass ? 0.95*k : 0.4*k;
        ctx.lineWidth = (pass ? 7 : 20)*U*k + 1;
        ctx.beginPath(); ctx.moveTo(p[i-1].x,p[i-1].y); ctx.lineTo(p[i].x,p[i].y); ctx.stroke();
      }
    }
    ctx.restore();
  }
  if (b.head && now - b.head.t < 300 && mode === 'camera'){
    ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=14*U;
    ctx.fillStyle = b.speed > SPEED_MIN() ? '#ffffff' : color;
    ctx.beginPath(); ctx.arc(b.head.x, b.head.y, 7*U+2, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
}
function text(str, x, y, size, color, alpha=1){
  ctx.save(); ctx.globalAlpha=alpha; ctx.font=`${size}px ${DISPLAY_FONT()}`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillText(str, x, y+3*U);
  ctx.fillStyle=color; ctx.fillText(str, x, y); ctx.restore();
}

function render(now){
  ctx.save();
  ctx.fillStyle = '#0e1016'; ctx.fillRect(0,0,W,H);
  if (shake > 0.3) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  if (mode === 'camera' && video.readyState >= 2){
    const vr = videoRect();
    ctx.save(); ctx.globalAlpha = 0.3; ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(video, W - vr.x - vr.w, vr.y, vr.w, vr.h); ctx.restore();
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2*U;
    for (const h of handsLm){ ctx.beginPath(); for (const [a,b] of HAND_LINKS){ ctx.moveTo(h[a][0],h[a][1]); ctx.lineTo(h[b][0],h[b][1]); } ctx.stroke(); }
    ctx.restore();
  } else {
    const g = ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.7);
    g.addColorStop(0,'#1b2030'); g.addColorStop(1,'#0e1016'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  for (const s of splats){
    ctx.save(); ctx.globalAlpha = s.a; ctx.fillStyle = s.color;
    for (const b of s.blobs){ ctx.beginPath(); ctx.arc(s.x+b.dx, s.y+b.dy, b.r, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  const showPick = (state === 'ready' || state === 'over') && pendingStart < 0 && starters.some(s => !s.dead && s.static);
  if (state === 'ready'){
    text(tr('title'), W/2, H*0.2, 72*U+20, '#ffcf3f');
    if (showPick) text(tr(mode === 'camera' ? 'pickCam' : 'pickMouse'), W/2, H*0.2 + 64*U + 16, 24*U+8, '#f6f1e7', 0.9);
  }
  if (state === 'over'){
    text(tr('over'), W/2, H*0.18, 70*U+18, '#ff5252');
    text(`${tr('d_'+diff)}   ${tr('score')} ${score}   ${tr('best')} ${best}`, W/2, H*0.18 + 66*U + 12, 28*U+10, '#f6f1e7');
  }
  if (showPick){
    for (const s of starters){
      if (s.dead) continue;
      const y = s.y + s.r + 36*U + 8;
      text(tr('d_'+s.diff), s.x, y, 32*U+10, s.diff === diff ? '#ffcf3f' : '#f6f1e7');
      text(tr('h_'+s.diff), s.x, y + 30*U + 8, 16*U+7, '#a3abb9');
    }
  }

  for (const h of halves){
    const t = TYPES[h.type];
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.ang + h.rot);
    ctx.beginPath();
    if (h.side === 0) ctx.rect(-h.r*1.4, -h.r*1.4, h.r*2.8, h.r*1.4);
    else ctx.rect(-h.r*1.4, 0, h.r*2.8, h.r*1.4);
    ctx.clip(); drawFace(t, h.r); ctx.restore();
  }
  for (const f of fruits){
    ctx.save();
    const bob = f.static ? Math.sin(f.bob*2.2)*8*U : 0;
    ctx.translate(f.x, f.y + bob); ctx.rotate(f.rot);
    if (f.bomb) drawBomb(f.r, now); else drawWhole(TYPES[f.type], f.r);
    ctx.restore();
  }
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*Math.max(0.3,p.life), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of popups) text(p.text, p.x, p.y, p.size*U+8, p.color, Math.min(1, p.life*2));
  blades.forEach((b,i) => drawBlade(b, now, BLADE_COLORS[i]));
  if (fistProgress > 0){
    handsLm.forEach((h,i) => {
      if (!fistHands[i]) return;
      const [x,y] = h[9], r = 30*U + 10;
      ctx.save(); ctx.lineWidth = 6*U + 2; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#ffcf3f'; ctx.beginPath(); ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2 + fistProgress*Math.PI*2); ctx.stroke();
      ctx.restore();
    });
  }
  ctx.restore();

  if (paused){
    ctx.fillStyle = 'rgba(14,16,22,.6)'; ctx.fillRect(0,0,W,H);
    text(tr('paused'), W/2, H*0.42, 72*U+20, '#ffcf3f');
    text(tr(mode === 'camera' ? 'resumeCam' : 'resumeKey'), W/2, H*0.42 + 64*U + 16, 26*U+8, '#f6f1e7');
    if (mode === 'camera') text(tr('resumeKey'), W/2, H*0.42 + 104*U + 28, 18*U+7, '#a3abb9');
  }

  if (flash > 0){ ctx.fillStyle = `rgba(255,240,220,${flash*0.85})`; ctx.fillRect(0,0,W,H); }
}

// ================= Update =================
const toast = $('toast');
function update(dt, now){
  if (paused){ toast.hidden = true; $('langBtn').hidden = false; return; }
  if (state === 'playing') updateSpawner(dt);
  const g = G();
  for (const f of fruits){
    if (f.static){ f.bob += dt; f.rot += f.vr*dt*0.3; continue; }
    f.vy += (f.g || g)*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.vr*dt;
    if (!f.dead && f.vy > 0 && f.y - f.r*1.5 > H){ f.dead = true; if (!f.bomb && state === 'playing') miss(f); }
  }
  fruits = fruits.filter(f => !f.dead);
  for (const h of halves){ h.vy += g*dt; h.x += h.vx*dt; h.y += h.vy*dt; h.rot += h.vr*dt; }
  halves = halves.filter(h => h.y < H + 200*U);
  for (const p of particles){ p.vy += g*p.grav*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.99; p.life -= dt*1.4; }
  particles = particles.filter(p => p.life > 0);
  for (const s of splats) s.a -= dt*0.07;
  splats = splats.filter(s => s.a > 0);
  for (const p of popups){ p.y -= 50*U*dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);

  if (comboCount > 0 && now - comboT > 280){
    if (comboCount >= 3 && state === 'playing'){
      score += comboCount;
      popups.push({ x:comboX, y:comboY - 50*U, text:tr('combo')(comboCount), color:'#ffcf3f', size:40, life:1.1 });
      sfx.combo(); hud();
    }
    comboCount = 0;
  }
  flash = Math.max(0, flash - dt*1.8);
  shake *= Math.pow(0.02, dt);
  if (pendingStart >= 0){ pendingStart -= dt; if (pendingStart < 0) startGame(); }
  if (overDelay >= 0){ overDelay -= dt; if (overDelay < 0) makeStarter(); }

  const noHand = mode === 'camera' && state !== 'menu' && now - lastHandSeen > 1200;
  if (noHand && state === 'playing' && now - lastHandSeen > 2500) togglePause();   // Auto-pause when the hand has been gone too long
  toast.hidden = !noHand;
  $('langBtn').hidden = state === 'playing';
  if (noHand) toast.textContent = tr('noHand');
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  if (mode === 'camera') detect(now);
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
